services:
  agent:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    env_file:
      - ../.env
    environment:
      # 容器的 localhost 不是宿主机；Java/MySQL/Redis 仍在宿主机
      DB_HOST: host.docker.internal
      REDIS_URL: redis://host.docker.internal:6379/0
      APP_HOST: 0.0.0.0
      APP_PORT: "8100"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../data:/app/data
    ports:
      - "127.0.0.1:8100:8100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    environment:
      # 只把 Token 传给 nginx，不把 .env 里所有密钥塞进静态服务容器
      # 用 --env-file .env 启动 compose，模板在容器启动时注入 /api
      AGENT_API_TOKEN: ${AGENT_API_TOKEN:-}
    depends_on:
      agent:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:80"
    restart: unless-stopped
